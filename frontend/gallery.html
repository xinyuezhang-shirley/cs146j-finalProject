<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — ECHO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="gallery.css">
</head>
<body class="gallery-page">

  <header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html" class="site-nav__logo">• ECHO</a>
      <div class="site-nav__links">
        <a href="index.html" class="site-nav__link">Studio</a>
        <a href="gallery.html" class="site-nav__link" aria-current="page">Gallery</a>
        <a href="about.html" class="site-nav__link">About</a>
      </div>
    </nav>
  </header>

  <main id="main" class="page page--gallery">
    <div class="page__inner">
      <header class="page__header">
        <p class="page__eyebrow">Echo Archive</p>
        <h1 class="page__title">Gallery</h1>
        <p class="page__lede">Saved Echo pieces from the Studio — select a card to preview its visualization below.</p>
      </header>

      <p id="gallery-notice" class="gallery-notice" role="status" aria-live="polite"></p>

      <section class="gallery-section" aria-labelledby="gallery-heading">
        <h2 id="gallery-heading" class="visually-hidden">Saved Echo works</h2>
        <div id="gallery-grid" class="gallery-grid"></div>
      </section>
    </div>
  </main>

  <div id="gallery-modal" class="gallery-modal" hidden>
    <div class="gallery-modal__backdrop" data-close></div>
    <div
      class="gallery-modal__dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="gallery-preview-title"
    >
      <header class="gallery-modal__header">
        <div class="gallery-modal__meta">
          <p id="gallery-preview-settings" class="gallery-modal__settings"></p>
          <h2 id="gallery-preview-title" class="gallery-modal__title">Preview</h2>
        </div>
        <button
          type="button"
          id="gallery-modal-close"
          class="gallery-modal__close"
          aria-label="Close preview"
          data-close
        >✕</button>
      </header>

      <div class="gallery-modal__stage">
        <div
          id="gallery-preview-canvas"
          class="studio-canvas gallery-modal__canvas"
          role="img"
          aria-label="Saved Echo visualization preview"
          tabindex="0"
        ></div>
        <pre id="gallery-preview-ascii" class="ascii-output gallery-modal__ascii" hidden aria-label="ASCII preview output"></pre>
      </div>

      <div class="gallery-modal__controls">
        <div class="control-group">
          <label for="modal-intensity-slider" class="control-label">Intensity <span class="control-value" id="modal-intensity-value">40</span></label>
          <input type="range" id="modal-intensity-slider" class="control-range" min="0" max="100" value="40" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40">
        </div>
        <div class="control-group">
          <label for="modal-density-slider" class="control-label">Density <span class="control-value" id="modal-density-value">60</span></label>
          <input type="range" id="modal-density-slider" class="control-range" min="0" max="100" value="60" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60">
        </div>
        <div class="control-group">
          <label for="modal-motion-slider" class="control-label">Motion <span class="control-value" id="modal-motion-value">40</span></label>
          <input type="range" id="modal-motion-slider" class="control-range" min="0" max="100" value="40" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40">
        </div>
        <div class="gallery-modal__actions">
          <button type="button" class="studio-save-btn" id="gallery-modal-save">Save changes</button>
          <p id="gallery-modal-status" class="gallery-modal__status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </div>
  </div>

  <audio id="bg-music" src="assets/about/backgroundMusic.mp3" loop preload="none"></audio>
  <button type="button" id="sound-toggle" class="sound-toggle" aria-pressed="true">sound: on</button>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script type="module" src="gallery.js"></script>
</body>
</html>
