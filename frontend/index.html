<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECHO: words that continue breathing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html" class="site-nav__logo">• ECHO</a>
      <div class="site-nav__links">
        <a href="index.html" class="site-nav__link" aria-current="page">Studio</a>
        <a href="gallery.html" class="site-nav__link">Gallery</a>
        <a href="about.html" class="site-nav__link">About</a>
      </div>
    </nav>
  </header>

  <main id="main">
    <!-- Title- Hero Lettering -->
    <section id="hero" class="section section--hero" aria-labelledby="echo-title">

      <p class="hero__meta">ECHO, A COMPUTATIONAL TEXT ART STUDIO</p>

      <h1 class="hero__title" id="echo-title">
        <span class="hero__letter" aria-hidden="true">E</span><span class="hero__letter" aria-hidden="true">C</span><span class="hero__letter" aria-hidden="true">H</span><span class="hero__letter" aria-hidden="true">O</span>
        <span class="visually-hidden">Echo</span>
      </h1>

      <p class="hero__subtitle">— <em>words that continue breathing</em> —</p>

      <a href="#compose" class="hero__enter" id="enter-btn">
        <span>begin your journey</span>
        <span class="hero__arrow" aria-hidden="true">↓</span>
      </a>
    </section>

    <!-- compose and adjustment section -->
    <section id="compose" class="section section--compose" aria-labelledby="compose-heading">
      <h2 id="compose-heading" class="visually-hidden">Compose your passage</h2>

      <!-- form for transforming and for gathering information-->
      <form id="compose-form" class="compose-form" novalidate>
        <div class="compose-frame">

          <div class="compose-frame__header">
            <span>COMPOSE</span>
            <span>“Words have no single fixed meaning.” — Jorge Luis Borges</span>
          </div>

          <label for="text-input" class="compose-label">Your passage</label>
          <textarea
            id="text-input"
            name="text"
            class="compose-input"
            maxlength="1200"
            rows="8"
            required
            placeholder="Leave your words here, and let them breathe on their own."
            aria-describedby="char-counter compose-error"
          ></textarea>

          <!-- error message for accessibilityfor the form -->
          <p id="compose-error" class="form-error" role="alert" hidden></p>
          <p id="transform-status" class="form-status" aria-live="polite"></p>

          <div class="compose-frame__footer">
            <button type="button" class="text-btn" id="sample-btn">Try a sample text</button>
            <span class="char-counter" id="char-counter" aria-live="polite">0000 / 1200</span>
          </div>
        </div>

        <button type="submit" class="transform-btn" id="transform-btn">TRANSFORM →</button>
      </form>

      <div class="compose-controls" role="group" aria-label="Visualization controls">
        <div class="control-group">
          <span class="control-label" id="theme-label">Theme</span>
          <div class="control-toggle" id="theme-toggle" role="group" aria-labelledby="theme-label">
            <button type="button" class="control-toggle__option is-active" id="theme-night" data-value="night" aria-pressed="true">Moonlight</button>
            <button type="button" class="control-toggle__option" id="theme-paper" data-value="paper" aria-pressed="false">PAPER</button>
          </div>
        </div>

        <div class="control-group">
          <label for="intensity-slider" class="control-label">Intensity <span class="control-value" id="intensity-value">40</span></label>
          <input type="range" id="intensity-slider" class="control-range" min="0" max="100" value="40" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40">
        </div>

        <div class="control-group">
          <label for="density-slider" class="control-label">Density <span class="control-value" id="density-value">60</span></label>
          <input type="range" id="density-slider" class="control-range" min="0" max="100" value="60" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60">
        </div>

        <div class="control-group">
          <label for="motion-slider" class="control-label">Motion <span class="control-value" id="motion-value">40</span></label>
          <input type="range" id="motion-slider" class="control-range" min="0" max="100" value="40" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40">
        </div>
      </div>
    </section>

    <!-- Studio Canvas section -->
    <section id="studio" class="section section--studio" aria-labelledby="studio-heading">
      <h2 id="studio-heading" class="visually-hidden">Visualization studio</h2>

      <p id="save-status" class="studio-save-status" aria-live="polite"></p>

      <div class="visualization-shell">
        <div id="field-summary" class="field-summary" aria-live="polite"></div>

        <div class="studio-canvas-wrap">
          <div class="studio-mode-bar" role="tablist" aria-label="Visualization modes">
            <button type="button" class="studio-mode-btn is-active" role="tab" id="tab-network" aria-selected="true" aria-controls="studio-canvas" data-mode="network">NETWORK</button>
            <button type="button" class="studio-mode-btn" role="tab" id="tab-soup" aria-selected="false" aria-controls="studio-canvas" data-mode="soup">SOUP</button>
            <button type="button" class="studio-mode-btn" role="tab" id="tab-ascii" aria-selected="false" aria-controls="studio-canvas" data-mode="ascii">ASCII</button>
            <button type="button" class="studio-mode-btn" role="tab" id="tab-vortex" aria-selected="false" aria-controls="studio-canvas" data-mode="vortex">VORTEX</button>
            <button type="button" class="studio-mode-btn" role="tab" id="tab-orbit" aria-selected="false" aria-controls="studio-canvas" data-mode="orbit">ORBIT</button>
          </div>

          <div
            id="studio-canvas"
            class="studio-canvas"
            role="img"
            aria-label="Interactive word visualization canvas"
            tabindex="0"
          ></div>
          <pre id="ascii-output" class="ascii-output" hidden aria-label="ASCII text art output"></pre>
        </div>
      </div>

      <div class="studio-actions">
        <button type="button" class="studio-save-btn" id="save-btn" disabled>Save to Gallery</button>
      </div>

      <button type="button" class="studio-side-nav" id="studio-back-btn" aria-label="Back to compose">‹</button>
    </section>

  </main>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
